<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Slot Machine</title>
</head>
<body>
    <h1>The Big 5 Fruit Roll </h1>
    <p>Press "Min Bet" to bet the minimum bet of $x. Press "Max Bet" to bet the maximum bet of $x. Press "Spin" to lock in bets and spin the wheel.</p>
    <div class="slotMachineContainer">
        <div class="slotMachine">
            <div class="slot1 wheel"></div>
            <div class="slot2 wheel"></div>
            <div class="slot3 wheel"></div>
        </div>

        <button id="minBet">Min Bet</button>
        <button id="maxBet">Max Bet</button>

        <h2 id="message"></h2>
        <div class="wallet">
            <p>My Wallet: $<span id="wallet"></span></p>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
